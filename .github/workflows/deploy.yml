# GitHub Pages 자동 배포.
# main 브랜치에 push 하면 빌드해서 사이트에 올린다. 사람이 할 일은 push 뿐이다.
#
# 처음 한 번만 설정 필요:
#   repo → Settings → Pages → Source 를 "GitHub Actions" 로 변경
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 돌릴 수도 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 뒤에 들어온 것만 살린다 (연속 push 시 충돌 방지)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 계산 로직이 깨지면 배포하지 않는다. 마진 계산이 틀린 사이트가 올라가는 것보다
      # 배포가 실패하는 쪽이 낫다.
      - name: 계산 로직 테스트
        run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
